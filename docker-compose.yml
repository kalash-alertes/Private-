# Environnement de développement. Les ports sont liés à localhost uniquement (pas d'exposition réseau).
# L'interface analyste est servie par le backend (http://localhost:8000) ; l'API JSON est sous /api.
# OpenSearch et Data Prepper (optionnel) seront ajoutés ici avec la collecte. OpenSearch Dashboards n'est plus prévu
# comme interface : l'interface est web_interface/.
services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-soc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_locally}
      POSTGRES_DB: ${POSTGRES_DB:-soc_incidents}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-soc} -d ${POSTGRES_DB:-soc_incidents}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      # Réseau de l'hôte pendant la construction : plus fiable que le réseau Docker sous WSL pour télécharger les paquets.
      network: host
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-soc}:${POSTGRES_PASSWORD:-change_me_locally}@database:5432/${POSTGRES_DB:-soc_incidents}
      APPLICATION_ENVIRONMENT: ${APPLICATION_ENVIRONMENT:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:8080}
      # Escalade automatique des incidents en retard toutes les N secondes (0 = désactivée).
      AUTOMATIC_ESCALATION_INTERVAL_SECONDS: ${AUTOMATIC_ESCALATION_INTERVAL_SECONDS:-300}
    depends_on:
      database:
        condition: service_healthy
    # Applique les migrations puis démarre l'API avec rechargement automatique (code monté en volume).
    command: sh -c "alembic upgrade head && uvicorn backend.main:application --host 0.0.0.0 --port 8000 --reload"
    volumes:
      - ./backend:/application/backend
      - ./web_interface:/application/web_interface
      - ./db:/application/db
    ports:
      - "127.0.0.1:8000:8000"

volumes:
  postgres_data:
