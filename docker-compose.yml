# Environnement de développement. Les ports sont liés à localhost uniquement (pas d'exposition réseau), SAUF le port
# syslog du backend, qui doit être joignable par FortiAnalyzer.
# L'interface analyste est servie par le backend (http://localhost:8000) ; l'API JSON est sous /api.
# OpenSearch et Data Prepper (optionnel) seront ajoutés ici avec la collecte. OpenSearch Dashboards n'est plus prévu
# comme interface : l'interface est web_interface/.
services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-soc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_locally}
      POSTGRES_DB: ${POSTGRES_DB:-soc_incidents}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-soc} -d ${POSTGRES_DB:-soc_incidents}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    # Toutes les valeurs du .env (APP_IS_IN_DEMO, SYSLOG_*, LOG_COLLECTION_*...) sont transmises au conteneur ;
    # les valeurs de `environment` ci-dessous priment (notamment DATABASE_URL, qui vise le service `database`).
    env_file:
      - path: .env
        required: false
    build:
      context: .
      # Réseau de l'hôte pendant la construction : plus fiable que le réseau Docker sous WSL pour télécharger les paquets.
      network: host
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-soc}:${POSTGRES_PASSWORD:-change_me_locally}@database:5432/${POSTGRES_DB:-soc_incidents}
      APPLICATION_ENVIRONMENT: ${APPLICATION_ENVIRONMENT:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:8080}
    depends_on:
      database:
        condition: service_healthy
    # Compte du conteneur : non-root par défaut. Mettre BACKEND_CONTAINER_USER=root dans le .env seulement si le projet
    # est dans un dossier partagé VirtualBox (fichiers montés illisibles sinon) ; voir scripts/start_backend.sh.
    user: ${BACKEND_CONTAINER_USER:-backend_runner}
    # Vérifie que le code est lisible, applique les migrations, puis démarre avec rechargement automatique.
    # Le script vient de l'image (scripts/ n'est pas monté) : il reste lisible même depuis un dossier partagé.
    command: sh scripts/start_backend.sh
    volumes:
      - ./backend:/application/backend
      - ./web_interface:/application/web_interface
      - ./db:/application/db
    ports:
      - "127.0.0.1:8000:8000"
      # Réception des logs FortiAnalyzer (syslog, UDP et TCP), sur toutes les interfaces : FortiAnalyzer est une autre
      # machine du réseau. Ouvert même en démonstration, mais rien n'y écoute alors. Restreindre les émetteurs avec
      # SYSLOG_ALLOWED_SENDER_ADDRESSES (et le pare-feu du poste).
      - "${SYSLOG_LISTEN_PORT:-5140}:${SYSLOG_LISTEN_PORT:-5140}/udp"
      - "${SYSLOG_LISTEN_PORT:-5140}:${SYSLOG_LISTEN_PORT:-5140}/tcp"

volumes:
  postgres_data:
