[alembic]
script_location = db/migrations
path_separator = os
prepend_sys_path = .
# L'URL de la base vient de DATABASE_URL (voir db/migrations/env.py), jamais d'ici.

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
